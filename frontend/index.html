<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIF Boundou — Géoportail Foncier</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- MapboxDraw requires mapboxgl global — alias MapLibre -->
    <script>window.mapboxgl = maplibregl;</script>

    <!-- MapboxDraw for geometry editing -->
    <script src="https://unpkg.com/@mapbox/mapbox-gl-draw@1.4.3/dist/mapbox-gl-draw.js"></script>
    <link href="https://unpkg.com/@mapbox/mapbox-gl-draw@1.4.3/dist/mapbox-gl-draw.css" rel="stylesheet" />

    <!-- Turf.js for geometry calculations -->
    <script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script>

    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --accent: #0ea5e9;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --navy: #0f172a;
        }

        * { box-sizing: border-box; }
        html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
        body { font-family:'Inter',system-ui,-apple-system,sans-serif; background:#f8fafc; color:#1e293b; }

        #map { width:100%; height:100%; }

        /* ---- HEADER ---- */
        .app-header {
            height: 56px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex; align-items: center; padding: 0 16px; gap: 12px;
            z-index: 40; position: relative;
            box-shadow: 0 2px 12px rgba(0,0,0,.25);
        }
        .app-header .logo-group { display:flex; align-items:center; gap:8px; }
        .app-header .logo-group img { height:32px; border-radius:4px; }
        .app-header .title-group { display:flex; align-items:center; gap:8px; border-left:1px solid rgba(255,255,255,.15); padding-left:12px; }
        .app-header .title-group h1 { font-size:1rem; font-weight:700; color:#fff; letter-spacing:.02em; white-space:nowrap; margin:0; }
        .app-header .title-group .badge { font-size:.6rem; background:var(--primary); color:#fff; padding:2px 8px; border-radius:999px; font-weight:600; }

        /* ---- SEARCH ---- */
        .search-container { flex:1; max-width:420px; position:relative; margin:0 auto; }
        .search-container input {
            width:100%; padding:8px 14px 8px 38px;
            background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15);
            border-radius:10px; color:#fff; font-size:.85rem; transition:all .2s; outline:none;
        }
        .search-container input::placeholder { color:rgba(255,255,255,.5); }
        .search-container input:focus { background:rgba(255,255,255,.18); border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.25); }
        .search-container .search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:rgba(255,255,255,.4); pointer-events:none; }
        .search-dropdown {
            position:absolute; top:calc(100% + 4px); left:0; right:0;
            background:#fff; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.2);
            max-height:60vh; overflow-y:auto; display:none; z-index:100; border:1px solid #e2e8f0;
        }
        .search-dropdown.active { display:block; }

        /* ---- HEADER BTNS ---- */
        .header-actions { display:flex; align-items:center; gap:6px; }
        .header-btn {
            display:flex; align-items:center; justify-content:center;
            width:36px; height:36px; border-radius:8px;
            background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.1);
            color:rgba(255,255,255,.7); cursor:pointer; transition:all .2s;
        }
        .header-btn:hover { background:rgba(255,255,255,.15); color:#fff; }
        .header-btn.active { background:var(--primary); border-color:var(--primary); color:#fff; }

        /* ---- STATS BAR ---- */
        .stats-bar {
            position:absolute; top:68px; left:50%; transform:translateX(-50%);
            z-index:30; display:flex; gap:6px;
            background:rgba(255,255,255,.92); backdrop-filter:blur(12px);
            padding:6px 10px; border-radius:12px;
            box-shadow:0 4px 20px rgba(0,0,0,.1); border:1px solid rgba(226,232,240,.6);
        }
        .stat-chip {
            display:flex; align-items:center; gap:5px;
            padding:4px 10px; border-radius:8px; font-size:.7rem; font-weight:600;
            cursor:pointer; transition:all .15s; user-select:none;
        }
        .stat-chip:hover { transform:translateY(-1px); box-shadow:0 2px 8px rgba(0,0,0,.08); }
        .stat-chip .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
        .stat-chip .count { font-weight:800; }

        /* ---- MAP CONTROLS ---- */
        .map-controls {
            position:absolute; bottom:24px; right:16px; z-index:30;
            display:flex; flex-direction:column; gap:6px;
        }
        .map-ctrl-btn {
            width:40px; height:40px; border-radius:10px;
            background:rgba(255,255,255,.95); backdrop-filter:blur(8px);
            border:1px solid #e2e8f0; display:flex; align-items:center;
            justify-content:center; cursor:pointer; color:#334155;
            box-shadow:0 2px 8px rgba(0,0,0,.08); transition:all .15s;
        }
        .map-ctrl-btn:hover { background:#fff; box-shadow:0 4px 16px rgba(0,0,0,.12); color:var(--primary); }
        .map-ctrl-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
        .map-ctrl-group { display:flex; flex-direction:column; border-radius:10px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.08); }
        .map-ctrl-group .map-ctrl-btn { border-radius:0; box-shadow:none; border-bottom:1px solid #e2e8f0; }
        .map-ctrl-group .map-ctrl-btn:first-child { border-radius:10px 10px 0 0; }
        .map-ctrl-group .map-ctrl-btn:last-child { border-radius:0 0 10px 10px; border-bottom:none; }

        /* ---- LEGEND ---- */
        .legend-panel {
            position:absolute; bottom:24px; left:16px; z-index:30;
            background:rgba(255,255,255,.95); backdrop-filter:blur(12px);
            border-radius:12px; padding:12px 14px;
            box-shadow:0 4px 20px rgba(0,0,0,.1); border:1px solid rgba(226,232,240,.6);
            min-width:160px;
        }
        .legend-title { font-size:.6rem; font-weight:700; text-transform:uppercase; color:#94a3b8; letter-spacing:.08em; margin-bottom:8px; }
        .legend-item { display:flex; align-items:center; gap:8px; padding:3px 0; cursor:pointer; user-select:none; }
        .legend-item .ldot { width:10px; height:10px; border-radius:3px; border:1px solid rgba(0,0,0,.08); flex-shrink:0; }
        .legend-item span { font-size:.75rem; font-weight:500; color:#475569; }
        .legend-item.off .ldot { opacity:.25; }
        .legend-item.off span { text-decoration:line-through; opacity:.4; }

        /* ---- DETAIL PANEL ---- */
        .detail-panel {
            position:fixed; top:56px; right:0; bottom:0;
            width:min(460px,100vw); z-index:50;
            background:#fff; border-left:1px solid #e2e8f0;
            transform:translateX(100%); transition:transform .35s cubic-bezier(.4,0,.2,1);
            display:flex; flex-direction:column;
            box-shadow:-8px 0 30px rgba(0,0,0,.08);
        }
        .detail-panel.open { transform:translateX(0); }
        .panel-head {
            background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%);
            padding:20px; color:#fff; flex-shrink:0; position:relative;
        }
        .panel-head .close-btn {
            position:absolute; top:12px; right:12px; width:32px; height:32px;
            border-radius:8px; background:rgba(255,255,255,.1); border:none;
            color:rgba(255,255,255,.7); cursor:pointer; display:flex;
            align-items:center; justify-content:center; transition:all .2s;
        }
        .panel-head .close-btn:hover { background:rgba(255,255,255,.2); color:#fff; }
        .panel-body { flex:1; overflow-y:auto; padding:20px; }
        .panel-body::-webkit-scrollbar { width:5px; }
        .panel-body::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }

        /* ---- CARDS ---- */
        .card { background:#fff; border-radius:14px; padding:18px; border:1px solid #e2e8f0; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.04); transition:all .15s; }
        .card:hover { box-shadow:0 4px 12px rgba(0,0,0,.06); }
        .card-title { display:flex; align-items:center; gap:8px; font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#94a3b8; margin-bottom:14px; padding-bottom:10px; border-bottom:1.5px solid #f1f5f9; }
        .card-title i { color:var(--primary); }
        .field { background:#f8fafc; border-radius:10px; padding:10px 12px; border:1px solid #e2e8f0; }
        .field-label { font-size:.6rem; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:#94a3b8; margin-bottom:3px; }
        .field-value { font-size:.88rem; font-weight:600; color:#1e293b; word-break:break-word; }
        .field-hl { background:linear-gradient(135deg,#ecfdf5,#d1fae5); border-color:#a7f3d0; }
        .data-row { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:#f8fafc; border-radius:8px; margin-bottom:6px; border:1px solid #e2e8f0; }
        .data-row .dlabel { font-size:.78rem; color:#64748b; }
        .data-row .dvalue { font-size:.85rem; font-weight:600; color:#1e293b; }
        .data-row .dvalue.mono { font-family:'SF Mono','Consolas',monospace; background:#eff6ff; padding:2px 8px; border-radius:6px; color:var(--primary); font-size:.8rem; }

        /* ---- STATUS BADGE ---- */
        .status-badge { display:inline-flex; align-items:center; gap:5px; padding:4px 12px; border-radius:20px; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.02em; }
        .sb-survey { background:#fef3c7; color:#92400e; }
        .sb-nicad { background:#dbeafe; color:#1e40af; }
        .sb-deliberee { background:#ede9fe; color:#5b21b6; }
        .sb-approuvee { background:#d1fae5; color:#065f46; }
        .sb-default { background:rgba(255,255,255,.15); color:#fff; }

        /* ---- WORKFLOW ---- */
        .workflow { display:flex; align-items:center; gap:0; margin-top:16px; }
        .wf-step { display:flex; flex-direction:column; align-items:center; gap:4px; }
        .wf-circle { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.75rem; background:#334155; color:rgba(255,255,255,.4); transition:all .3s; }
        .wf-circle.done { background:var(--success); color:#fff; box-shadow:0 2px 8px rgba(16,185,129,.35); }
        .wf-circle.active { background:var(--primary); color:#fff; box-shadow:0 2px 8px rgba(37,99,235,.35); }
        .wf-label { font-size:.6rem; color:rgba(255,255,255,.6); font-weight:600; }
        .wf-line { flex:1; height:3px; background:rgba(255,255,255,.15); border-radius:2px; min-width:24px; }
        .wf-line.done { background:var(--success); }

        /* ---- EDIT TOOLBAR ---- */
        .edit-toolbar {
            position:absolute; top:68px; left:50%; transform:translateX(-50%);
            z-index:40; display:flex; gap:6px; align-items:center;
            background:rgba(15,23,42,.92); backdrop-filter:blur(12px);
            padding:8px 14px; border-radius:12px; color:#fff;
            box-shadow:0 4px 20px rgba(0,0,0,.3);
        }
        .edit-toolbar.hidden { display:none; }
        .edit-toolbar button { padding:6px 14px; border-radius:8px; font-size:.78rem; font-weight:600; border:none; cursor:pointer; display:flex; align-items:center; gap:4px; transition:all .15s; }
        .edit-toolbar .btn-save { background:var(--success); color:#fff; }
        .edit-toolbar .btn-save:hover { background:#059669; }
        .edit-toolbar .btn-save:disabled { opacity:.5; cursor:not-allowed; }
        .edit-toolbar .btn-cancel { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.2); }
        .edit-toolbar .btn-cancel:hover { background:rgba(255,255,255,.2); }

        /* QGIS-like Draw overrides */
        .mapbox-gl-draw_ctrl-draw-btn { display:none !important; }
        .mapbox-gl-draw_point { cursor:crosshair !important; }

        /* ---- MODALS ---- */
        .modal-overlay { position:fixed; inset:0; z-index:100; background:rgba(15,23,42,.6); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; transition:opacity .2s; }
        .modal-overlay.hidden { display:none; }
        .modal { background:#fff; border-radius:16px; width:min(440px,90vw); box-shadow:0 25px 50px rgba(0,0,0,.25); overflow:hidden; }
        .modal-head { padding:20px 24px; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; justify-content:space-between; }
        .modal-head h3 { font-size:1rem; font-weight:700; margin:0; }
        .modal-body { padding:20px 24px; }
        .modal-foot { padding:14px 24px; border-top:1px solid #e2e8f0; display:flex; justify-content:flex-end; gap:8px; }

        .login-field { display:flex; flex-direction:column; gap:4px; margin-bottom:14px; }
        .login-field label { font-size:.75rem; font-weight:600; color:#64748b; }
        .login-field input { padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:10px; font-size:.88rem; outline:none; transition:all .2s; }
        .login-field input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.1); }

        /* ---- BUTTONS ---- */
        .btn { padding:8px 16px; border-radius:10px; font-size:.82rem; font-weight:600; border:none; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:all .15s; }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-primary:hover { background:var(--primary-dark); }
        .btn-secondary { background:#f1f5f9; color:#475569; border:1px solid #e2e8f0; }
        .btn-secondary:hover { background:#e2e8f0; }
        .btn-sm { padding:5px 10px; font-size:.75rem; border-radius:8px; }

        .check-group { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
        .check-item { display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:8px; border:1.5px solid #e2e8f0; cursor:pointer; font-size:.8rem; font-weight:500; transition:all .15s; user-select:none; }
        .check-item:hover { border-color:var(--primary); }
        .check-item.active { background:var(--primary-light); border-color:var(--primary); color:var(--primary-dark); }
        .check-item .cdot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }

        /* ---- TOASTS ---- */
        .toast-container { position:fixed; top:68px; right:16px; z-index:200; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
        .toast { padding:12px 16px; border-radius:10px; font-size:.82rem; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.12); display:flex; align-items:center; gap:8px; transform:translateX(120%); transition:transform .3s cubic-bezier(.4,0,.2,1); max-width:360px; pointer-events:auto; }
        .toast.show { transform:translateX(0); }
        .toast.success { background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
        .toast.error { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
        .toast.info { background:#eff6ff; color:#1e40af; border:1px solid #bfdbfe; }

        .conflict-box { background:linear-gradient(135deg,#fef2f2,#fee2e2); border-left:4px solid #ef4444; border-radius:12px; padding:14px 16px; display:flex; align-items:start; gap:12px; }
        .photo-card { border-radius:12px; overflow:hidden; background:#f8fafc; border:1.5px solid #e2e8f0; transition:all .2s; }
        .photo-card:hover { border-color:var(--primary); box-shadow:0 4px 12px rgba(37,99,235,.1); }
        .photo-card img { width:100%; height:120px; object-fit:cover; }
        .photo-card .plabel { padding:8px 10px; font-size:.68rem; font-weight:600; color:#64748b; text-align:center; border-top:1px solid #e2e8f0; background:#fff; }

        .spinner-overlay { position:absolute; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; background:rgba(15,23,42,.6); backdrop-filter:blur(4px); }
        .spinner-overlay.hidden { display:none; }
        .spinner { width:40px; height:40px; border:4px solid rgba(255,255,255,.2); border-top-color:var(--primary); border-radius:50%; animation:spin .8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .skeleton { background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:8px; }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        @media (max-width:768px) {
            .stats-bar { display:none; }
            .detail-panel { width:100vw; }
            .legend-panel { bottom:8px; left:8px; }
            .map-controls { bottom:8px; right:8px; }
            .app-header .title-group { display:none; }
        }

        .maplibregl-ctrl-top-left { top:8px; left:8px; }
        .maplibregl-ctrl-group { border-radius:10px !important; box-shadow:0 2px 8px rgba(0,0,0,.08) !important; }
    </style>
</head>

<body class="flex flex-col h-screen">

    <!-- HEADER -->
    <header class="app-header">
        <div class="logo-group">
            <img src="assets/logos/logo_senegal.jpg" alt="Sénégal">
            <img src="assets/logos/logo_procasef.jpg" alt="PROCASEF">
            <img src="assets/logos/logo_bet.jpg" alt="BET Plus">
        </div>
        <div class="title-group">
            <h1>SIF BOUNDOU</h1>
            <span class="badge">Géoportail</span>
        </div>

        <div class="search-container">
            <i data-lucide="search" class="search-icon" style="width:16px;height:16px;"></i>
            <input type="text" id="searchInput" placeholder="Rechercher parcelle, NICAD, nom..." autocomplete="off">
            <div id="searchDropdown" class="search-dropdown">
                <div id="searchResults" class="p-2 space-y-1"></div>
            </div>
        </div>

        <div class="header-actions">
            <button class="header-btn" id="btnExport" title="Exporter les parcelles">
                <i data-lucide="download" style="width:18px;height:18px;"></i>
            </button>
            <button class="header-btn" id="btnAdmin" title="Connexion Admin">
                <i data-lucide="shield" style="width:18px;height:18px;"></i>
            </button>
            <button class="header-btn active hidden" id="btnAdminLogout" title="Déconnexion Admin">
                <i data-lucide="log-out" style="width:18px;height:18px;"></i>
            </button>
        </div>
    </header>

    <!-- MAIN -->
    <main class="flex-1 relative">
        <div id="loadingOverlay" class="spinner-overlay">
            <div class="text-center">
                <div class="spinner mx-auto mb-3"></div>
                <p class="text-white text-sm font-medium">Chargement des parcelles...</p>
            </div>
        </div>

        <div id="map" class="w-full h-full"></div>

        <!-- Stats Bar -->
        <div class="stats-bar" id="statsBar">
            <div class="stat-chip" onclick="app.filterByStatus('all')" title="Total">
                <span class="dot" style="background:#64748b;"></span>
                <span>Total</span>
                <span class="count" id="statTotal">--</span>
            </div>
            <div class="stat-chip" onclick="app.filterByStatus('Survey')" title="Enquêtées">
                <span class="dot" style="background:#eab308;"></span>
                <span>Enquêtée</span>
                <span class="count" id="statSurvey">--</span>
            </div>
            <div class="stat-chip" onclick="app.filterByStatus('NICAD')" title="NICAD">
                <span class="dot" style="background:#3b82f6;"></span>
                <span>NICAD</span>
                <span class="count" id="statNicad">--</span>
            </div>
            <div class="stat-chip" onclick="app.filterByStatus('deliberee')" title="Délibérées">
                <span class="dot" style="background:#8b5cf6;"></span>
                <span>Délibérée</span>
                <span class="count" id="statDeliberee">--</span>
            </div>
            <div class="stat-chip" onclick="app.filterByStatus('approuvee')" title="Approuvées">
                <span class="dot" style="background:#10b981;"></span>
                <span>Approuvée</span>
                <span class="count" id="statApprouvee">--</span>
            </div>
        </div>

        <!-- Edit Geometry Toolbar -->
        <div class="edit-toolbar hidden" id="editToolbar">
            <i data-lucide="pen-tool" style="width:16px;height:16px;color:var(--primary);"></i>
            <span style="font-size:.82rem;font-weight:600;">Mode Édition</span>
            <button class="btn-save" id="btnSaveGeometry"><i data-lucide="check" style="width:14px;height:14px;"></i> Sauvegarder</button>
            <button class="btn-cancel" id="btnCancelEdit"><i data-lucide="x" style="width:14px;height:14px;"></i> Annuler</button>
        </div>

        <!-- Legend -->
        <div class="legend-panel" id="legendPanel">
            <div class="legend-title">Légende</div>
            <div id="legendContent"></div>
        </div>

        <!-- Map Controls -->
        <div class="map-controls">
            <div class="map-ctrl-group">
                <button class="map-ctrl-btn" onclick="app.switchBasemap('osm')" title="OpenStreetMap"><i data-lucide="map" style="width:18px;height:18px;"></i></button>
                <button class="map-ctrl-btn" onclick="app.switchBasemap('satellite')" title="Satellite Esri"><i data-lucide="satellite" style="width:18px;height:18px;"></i></button>
                <button class="map-ctrl-btn" onclick="app.switchBasemap('google-satellite')" title="Google Satellite"><span style="font-weight:800;font-size:.7rem;">GS</span></button>
            </div>
            <button class="map-ctrl-btn" id="btn3D" onclick="app.toggle3D()" title="Vue 3D / 2D"><i data-lucide="box" style="width:18px;height:18px;"></i></button>
            <button class="map-ctrl-btn" onclick="app.toggleColorMode()" title="Mode couleur"><i data-lucide="palette" style="width:18px;height:18px;"></i></button>
            <button class="map-ctrl-btn" onclick="app.resetView()" title="Reset vue"><i data-lucide="compass" style="width:18px;height:18px;"></i></button>
        </div>

        <!-- Detail Panel -->
        <div class="detail-panel" id="detailPanel">
            <div class="panel-head" id="panelHead">
                <button class="close-btn" onclick="app.closePanel()"><i data-lucide="x" style="width:18px;height:18px;"></i></button>
                <p style="font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.5);margin:0 0 4px;">Parcelle</p>
                <h2 id="panelTitle" style="font-size:1.4rem;font-weight:800;margin:0;">--</h2>
                <div id="panelStatusBadge" class="status-badge sb-default" style="margin-top:10px;">--</div>
                <div class="workflow" id="panelWorkflow">
                    <div class="wf-step"><div class="wf-circle done" id="wf1"><i data-lucide="clipboard-check" style="width:16px;height:16px;"></i></div><span class="wf-label">Enquête</span></div>
                    <div class="wf-line" id="wfLine1"></div>
                    <div class="wf-step"><div class="wf-circle" id="wf2">2</div><span class="wf-label">NICAD</span></div>
                    <div class="wf-line" id="wfLine2"></div>
                    <div class="wf-step"><div class="wf-circle" id="wf3">3</div><span class="wf-label">Approuvé</span></div>
                </div>
                <button class="btn btn-sm hidden" id="btnEditGeometry" style="margin-top:12px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;">
                    <i data-lucide="pen-tool" style="width:14px;height:14px;"></i> Modifier la géométrie
                </button>
            </div>
            <div class="panel-body" id="panelBody"></div>
        </div>
    </main>

    <!-- Export Modal -->
    <div class="modal-overlay hidden" id="exportModal">
        <div class="modal">
            <div class="modal-head">
                <h3>Exporter les Parcelles</h3>
                <button onclick="app.closeExportModal()" style="background:none;border:none;cursor:pointer;color:#94a3b8;padding:4px;"><i data-lucide="x" style="width:20px;height:20px;"></i></button>
            </div>
            <div class="modal-body">
                <p style="font-size:.82rem;color:#64748b;margin-bottom:12px;">Sélectionnez les statuts à exporter :</p>
                <div class="check-group" id="exportStatusGroup">
                    <label class="check-item active" data-status="Survey"><span class="cdot" style="background:#eab308;"></span> Enquêtée</label>
                    <label class="check-item active" data-status="NICAD"><span class="cdot" style="background:#3b82f6;"></span> NICAD</label>
                    <label class="check-item active" data-status="deliberee"><span class="cdot" style="background:#8b5cf6;"></span> Délibérée</label>
                    <label class="check-item active" data-status="approuvee"><span class="cdot" style="background:#10b981;"></span> Approuvée</label>
                </div>
                <p style="font-size:.82rem;color:#64748b;margin:14px 0 8px;">Format :</p>
                <div class="check-group" id="exportFormatGroup">
                    <label class="check-item active" data-format="geojson">GeoJSON</label>
                    <label class="check-item" data-format="xlsx">Excel (.xlsx)</label>
                </div>
            </div>
            <div class="modal-foot">
                <button class="btn btn-secondary" onclick="app.closeExportModal()">Annuler</button>
                <button class="btn btn-primary" onclick="app.doExport()"><i data-lucide="download" style="width:16px;height:16px;"></i> Exporter</button>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay hidden" id="loginModal">
        <div class="modal">
            <div class="modal-head">
                <h3>Connexion Administrateur</h3>
                <button onclick="app.closeLoginModal()" style="background:none;border:none;cursor:pointer;color:#94a3b8;padding:4px;"><i data-lucide="x" style="width:20px;height:20px;"></i></button>
            </div>
            <div class="modal-body">
                <div class="login-field">
                    <label>Nom d'utilisateur</label>
                    <input type="text" id="loginUsername" placeholder="Identifiant">
                </div>
                <div class="login-field">
                    <label>Mot de passe</label>
                    <input type="password" id="loginPassword" placeholder="Mot de passe">
                </div>
                <p id="loginError" class="hidden" style="color:var(--danger);font-size:.82rem;margin-top:8px;"></p>
            </div>
            <div class="modal-foot">
                <button class="btn btn-secondary" onclick="app.closeLoginModal()">Annuler</button>
                <button class="btn btn-primary" onclick="app.doLogin()" id="loginBtn">Se connecter</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
